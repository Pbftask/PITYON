<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spiralist — Photo Spiral Art Generator</title>
<style>
  :root{
    --bg:#ffffff;
    --surface:#f4f4f5;
    --surface-2:#ececee;
    --border:#e6e6e8;
    --text:#111113;
    --text-dim:#9b9ba1;
    --text-faint:#c4c4c9;
    --ink:#141416;
    --gold:#a9895f;
    --gold-2:#7c6440;
    --danger:#e2604f;
    --radius-lg:18px;
    --radius-md:12px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;}
  ::selection{background:var(--ink);color:#fff;}

  /* ---------- HEADER ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;
    padding:calc(12px + var(--safe-t)) 16px 10px 16px;
    background:var(--bg);border-bottom:1px solid var(--border);
  }
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
  .brand-mark{width:32px;height:32px;color:var(--gold);animation:spin-slow 14s linear infinite;}
  @keyframes spin-slow{to{transform:rotate(360deg);}}
  .brand-name{font-size:10.5px;font-weight:700;letter-spacing:2.5px;color:var(--text);margin-top:2px;}
  .head-actions{display:flex;align-items:center;gap:16px;padding-top:6px;}
  .icon-btn{
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink);
    transition:opacity .15s ease, transform .1s ease;
  }
  .icon-btn svg{width:22px;height:22px;}
  .icon-btn:active{transform:scale(.9);}
  .icon-btn:disabled{opacity:.28;pointer-events:none;}
  .icon-btn.active{color:var(--gold);}

  /* ---------- MAIN ---------- */
  main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative;}

  #action-row{
    display:none;gap:10px;padding:12px 16px;flex:0 0 auto;
    border-bottom:1px solid var(--border);
  }
  #action-row.show{display:flex;}
  .pill-btn{
    padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;
    background:var(--ink);color:#fff;transition:transform .12s ease, opacity .12s ease;
    white-space:nowrap;
  }
  .pill-btn:active{transform:scale(.96);}

  #stage-wrap{
    flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
    overflow:hidden;min-height:0;padding:10px 18px;
  }
  #stage-wrap.dragover::after{
    content:"Lepas foto di sini";position:absolute;inset:10px;
    border:2px dashed var(--gold);border-radius:var(--radius-lg);
    display:flex;align-items:center;justify-content:center;color:var(--gold-2);font-weight:700;font-size:14px;
    background:rgba(169,137,95,0.06);z-index:30;pointer-events:none;
  }

  /* Empty state */
  #empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:32px;text-align:center;max-width:340px;margin:0 auto;
  }
  #empty-state .up-icon{width:76px;height:76px;color:var(--ink);}
  #empty-state h2{font-size:17px;margin:4px 0 0;font-weight:700;}
  #empty-state p{font-size:13px;color:var(--text-dim);margin:0;line-height:1.55;}
  .upload-btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
  .btn-upload{
    padding:11px 18px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;
    transition:background .15s ease;white-space:nowrap;
  }
  .btn-upload:active{transform:scale(.96);}
  .footer-links{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
  .footer-links a{font-size:11.5px;color:var(--text-dim);text-decoration:none;}
  .footer-links .dot{font-size:10px;color:var(--text-faint);}

  /* Canvas */
  #canvas-stage{display:none;width:100%;height:100%;align-items:center;justify-content:center;}
  #canvas-stage.show{display:flex;}
  #canvas-after{max-width:100%;max-height:100%;display:block;}

  #video-scrub-bar{
    position:absolute;left:16px;right:16px;bottom:10px;display:flex;align-items:center;gap:8px;z-index:9;
    background:rgba(20,20,22,0.75);backdrop-filter:blur(6px);padding:6px 10px;border-radius:99px;
  }
  #video-scrub-bar .icon-btn{width:28px;height:28px;color:#fff;}
  #video-scrub-bar input[type=range]{flex:1 1 auto;height:26px;accent-color:#fff;}
  #video-scrub-bar #video-time{font-size:10px;color:#e8e8ea;white-space:nowrap;font-variant-numeric:tabular-nums;}

  .spinner-overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:15;
    background:rgba(255,255,255,0.6);
  }
  .spinner-overlay.show{display:flex;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--ink);animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ---------- BOTTOM PANEL ---------- */
  #bottom-panel{
    display:none;flex:0 0 auto;padding:6px 18px calc(16px + var(--safe-b));
    background:var(--bg);border-top:1px solid var(--border);
  }
  #bottom-panel.show{display:block;}

  .value-row{display:flex;justify-content:flex-end;padding:6px 2px 0;}
  .value-row span{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;
    touch-action:pan-y;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;
    background:linear-gradient(90deg, var(--ink) 0%, var(--ink) var(--fill,30%), var(--surface-2) var(--fill,30%), var(--surface-2) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--ink);margin-top:-8.5px;box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--surface-2);}
  input[type=range]::-moz-range-progress{height:3px;border-radius:99px;background:var(--ink);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:none;}

  #tabs-row{
    display:flex;padding:4px 2px 16px;gap:14px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  #tabs-row::-webkit-scrollbar{display:none;}
  .tab-btn{
    font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--text-faint);
    padding:6px 2px;flex:0 0 auto;text-align:center;transition:color .15s ease;white-space:nowrap;
  }
  .tab-btn.active{color:var(--text);}

  .seg-row{
    display:flex;background:var(--surface);border-radius:999px;padding:4px;margin-bottom:12px;
  }
  .seg-btn{
    flex:1 1 0;padding:9px 6px;border-radius:999px;font-size:12.5px;font-weight:700;
    color:var(--text-dim);text-align:center;letter-spacing:.3px;transition:all .15s ease;
  }
  .seg-btn.active{background:var(--ink);color:#fff;}
  .seg-btn:active{transform:scale(.97);}

  .opt-block{margin-bottom:14px;}
  .opt-head{font-size:11.5px;font-weight:700;letter-spacing:.5px;color:var(--text-dim);margin-bottom:8px;}
  .opt-row{display:flex;align-items:center;gap:10px;}
  .seg-row-inline{flex:1 1 auto;margin-bottom:0;}
  .swatches{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .swatch-input{
    -webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--border);padding:0;background:none;cursor:pointer;overflow:hidden;
  }
  .swatch-input::-webkit-color-swatch-wrapper{padding:0;}
  .swatch-input::-webkit-color-swatch{border:none;border-radius:50%;}
  .swatch-input::-moz-color-swatch{border:none;border-radius:50%;}

  #canvas-stage.checker{
    background-image:
      linear-gradient(45deg,#e4e4e6 25%,transparent 25%),
      linear-gradient(-45deg,#e4e4e6 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#e4e4e6 75%),
      linear-gradient(-45deg,transparent 75%,#e4e4e6 75%);
    background-size:18px 18px;
    background-position:0 0,0 9px,9px -9px,-9px 0px;
  }

  #btn-export{
    width:100%;padding:15px;border-radius:999px;background:var(--ink);color:#fff;
    font-size:14.5px;font-weight:700;letter-spacing:1px;text-align:center;
    transition:transform .12s ease, opacity .12s ease;
  }
  #btn-export:active{transform:scale(.98);}
  #btn-export:disabled{opacity:.4;pointer-events:none;}

  /* ---------- EXPORT PANEL (top-right dropdown) ---------- */
  #export-panel-backdrop{
    display:none;position:fixed;inset:0;background:rgba(20,20,22,0.32);z-index:39;
  }
  #export-panel-backdrop.show{display:block;}
  #export-panel{
    display:none;position:fixed;top:calc(64px + var(--safe-t));right:14px;width:min(320px, calc(100vw - 28px));
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:0 12px 36px rgba(20,20,22,0.18);padding:16px;z-index:40;
    max-height:calc(100vh - 100px - var(--safe-t));overflow-y:auto;
  }
  #export-panel.show{display:block;animation:panel-in .16s ease;}
  @keyframes panel-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .panel-title{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--text);margin:0 0 14px;text-transform:uppercase;}

  #export-progress-wrap{display:none;margin-top:12px;}
  #export-progress-wrap.show{display:block;}
  .progress-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;}
  .progress-track{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .progress-bar{height:100%;width:0%;background:var(--ink);border-radius:99px;transition:width .1s linear;}
  .link-cancel{display:block;text-align:center;font-size:12px;color:var(--text-dim);margin-top:10px;font-weight:600;}

  .hidden{display:none !important;}

  #workspace{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
  @media (min-width:720px){
    #stage-wrap{padding:24px;}
  }
  @media (min-width:980px){
    body{overflow:hidden;}
    #workspace{flex-direction:row;}
    #stage-wrap{flex:1 1 auto;}
    #bottom-panel{flex:0 0 360px;border-top:none;border-left:1px solid var(--border);padding:16px 20px calc(20px + var(--safe-b));overflow-y:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 48 48" fill="none">
      <path d="M24 24c1.6 0 2.9-1.3 2.9-2.9S25.6 18.2 24 18.2s-4.2 1.5-4.2 4.2 2.1 5.6 4.8 5.6 6.4-2.6 6.4-6.7-3.2-8-7.4-8-9.1 3.9-9.1 9.4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M38 8l1 2.6L41.6 12 39 13l-1 2.6L37 13l-2.6-1L37 10.6z" fill="currentColor"/>
    </svg>
    <span class="brand-name">SPIRALIST</span>
  </div>
  <div class="head-actions">
    <button class="icon-btn" id="btn-undo" title="Undo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" title="Redo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button class="icon-btn" id="btn-fullscreen" title="Layar penuh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="icon-btn" id="btn-export-settings" title="Export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
  </div>
</header>

<div id="export-panel-backdrop"></div>
<div id="export-panel">
  <div class="opt-block">
    <div class="opt-head"><span>Warna Motif</span></div>
    <div class="opt-row">
      <div class="seg-row seg-row-inline" id="color-mode-row"></div>
      <div class="swatches" id="color-swatches"></div>
    </div>
  </div>

  <div class="opt-block">
    <div class="opt-head"><span>Background</span></div>
    <div class="opt-row">
      <div class="seg-row seg-row-inline" id="bg-mode-row"></div>
      <div class="swatches" id="bg-swatches"></div>
    </div>
  </div>

  <p class="panel-title">Format</p>
  <div class="seg-row" id="format-row"></div>
  <button id="btn-export">EXPORT</button>
  <div id="export-progress-wrap">
    <div class="progress-label"><span id="export-status">Memproses…</span><span id="export-pct">0%</span></div>
    <div class="progress-track"><div class="progress-bar" id="export-bar"></div></div>
    <button class="link-cancel" id="btn-export-cancel">Batal</button>
  </div>
</div>

<main>
  <div id="action-row">
    <button class="pill-btn" id="btn-change-photo">Ganti foto</button>
    <button class="pill-btn" id="btn-change-video">Ganti video</button>
  </div>
  <div id="workspace">
  <div id="stage-wrap">
    <div id="empty-state">
      <svg class="up-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="9" width="36" height="30" rx="2"/>
        <path d="M6 32l9-9 8 8 7-7 9 9"/>
        <circle cx="18" cy="18" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
      <h2>Ubah foto atau video jadi seni spiral</h2>
      <p>Unggah foto atau video dari galeri, atau ambil foto langsung dari kamera. Semua diproses lokal di perangkatmu — file tidak pernah diunggah ke server.</p>
      <div class="upload-btn-row">
        <button class="btn-upload" id="btn-pick-gallery">Upload foto</button>
        <button class="btn-upload" id="btn-pick-video">Upload video</button>
      </div>
      <div class="footer-links">
        <a href="privasi.html">Kebijakan privasi</a>
        <span class="dot">•</span>
        <a href="tentang.html">Tentang</a>
        <span class="dot">•</span>
        <a href="kontak.html">Kontak</a>
      </div>
    </div>

    <div id="canvas-stage">
      <canvas id="canvas-after"></canvas>
      <div class="spinner-overlay" id="spinner"><div class="spinner"></div></div>
    </div>

    <div id="video-scrub-bar" class="hidden">
      <button class="icon-btn" id="btn-preview-playpause" title="Putar/Jeda pratinjau">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none;"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <input type="range" id="video-scrub" min="0" max="1000" value="0" step="1">
      <span id="video-time">0:00 / 0:00</span>
    </div>
  </div>

  <div id="bottom-panel">
    <div class="value-row"><span id="val-display">30%</span></div>
    <input type="range" id="main-slider" min="0" max="100" value="30" step="1">
    <div id="tabs-row"></div>
    <div class="seg-row" id="style-row"></div>
  </div>
  </div>
</main>

<input type="file" id="file-gallery" accept="image/jpeg,image/png,image/webp" class="hidden">
<input type="file" id="file-video-gallery" accept="video/*" class="hidden">

<script>
(function(){
"use strict";

/* ============================================================
   STATE
============================================================ */
const CONST = { rotation:0, smoothness:35, threshold:50, invert:false };
const DEFAULTS = Object.assign({
  style:'spiral', amount:60, size:100, brightness:0, contrast:110,
  spacing:100, thickness:3, detail:100,
  colorMode:'solid', color1:'#141414', color2:'#a9895f',
  bgMode:'solid', bgColor1:'#ffffff', bgColor2:'#e7e2d8'
}, CONST);
let state = Object.assign({}, DEFAULTS);

const TABS = [
  {key:'amount',     label:'RINGS',      min:10,  max:160},
  {key:'size',       label:'SCALE',      min:50,  max:150},
  {key:'spacing',    label:'SPACING',    min:40,  max:220},
  {key:'thickness',  label:'THICKNESS',  min:1,   max:12},
  {key:'detail',     label:'DETAIL',     min:40,  max:220},
  {key:'brightness', label:'LIGHTNESS',  min:-50, max:50},
  {key:'contrast',   label:'CONTRAST',   min:50,  max:200},
];
let activeTab = 0;

const STYLES = [
  {id:'spiral', label:'SPIRAL'},
  {id:'lines',  label:'LINES'},
  {id:'dots',   label:'DOTS'},
];

let history = [];
let historyIdx = -1;
let historyDebounce = null;

let img = null;
let lumPreview = null;
let naturalW = 0, naturalH = 0;
let previewW = 0, previewH = 0;

let mediaType = 'image';
let videoEl = null;
let videoObjectUrl = null;
let videoDuration = 0;
let videoPreviewLoopRunning = false;
let videoPreviewPlaying = false;
let lastPreviewFrameT = 0;
const PREVIEW_FRAME_INTERVAL = 1000/18;

let imageFmt = 'png';
let exportState = { running:false, cancelled:false, resolution:640, fps:24, includeAudio:true, format:'webm' };
let exportRecorder=null, exportChunks=[], exportCanvas=null, exportCtx=null;
let ffmpegInstance=null, ffmpegLoadingPromise=null;

const $ = (id)=>document.getElementById(id);
const els = {
  stageWrap: $('stage-wrap'),
  emptyState: $('empty-state'),
  actionRow: $('action-row'),
  canvasStage: $('canvas-stage'),
  after: $('canvas-after'),
  spinner: $('spinner'),
  scrubBar: $('video-scrub-bar'),
  scrubInput: $('video-scrub'),
  scrubTime: $('video-time'),
  btnPreviewPlayPause: $('btn-preview-playpause'),
  iconPlay: $('icon-play'),
  iconPause: $('icon-pause'),
  bottomPanel: $('bottom-panel'),
  valDisplay: $('val-display'),
  mainSlider: $('main-slider'),
  tabsRow: $('tabs-row'),
  styleRow: $('style-row'),
  formatRow: $('format-row'),
  btnExport: $('btn-export'),
  exportProgressWrap: $('export-progress-wrap'),
  exportStatus: $('export-status'),
  exportPct: $('export-pct'),
  exportBar: $('export-bar'),
};
const ctxAfter = els.after.getContext('2d');

/* ============================================================
   BUILD CONTROLS
============================================================ */
function buildTabs(){
  els.tabsRow.innerHTML = TABS.map((t,i)=>`<button class="tab-btn" data-i="${i}">${t.label}</button>`).join('');
  els.tabsRow.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeTab = parseInt(btn.dataset.i,10);
      syncTabs();
    });
  });
  syncTabs();
}
function syncTabs(){
  els.tabsRow.querySelectorAll('.tab-btn').forEach(b=>{
    const isActive = parseInt(b.dataset.i,10)===activeTab;
    b.classList.toggle('active', isActive);
    if(isActive) b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  });
  const t = TABS[activeTab];
  els.mainSlider.min = t.min; els.mainSlider.max = t.max;
  els.mainSlider.value = state[t.key];
  updateSliderVisual();
}
function updateSliderVisual(){
  const t = TABS[activeTab];
  const val = state[t.key];
  const pct = Math.round(((val - t.min) / (t.max - t.min)) * 100);
  els.mainSlider.style.setProperty('--fill', pct+'%');
  els.valDisplay.textContent = pct + '%';
}
els.mainSlider.addEventListener('input', ()=>{
  const t = TABS[activeTab];
  state[t.key] = parseFloat(els.mainSlider.value);
  updateSliderVisual();
  scheduleRender();
});
els.mainSlider.addEventListener('change', ()=> pushHistory());

function buildStyleRow(){
  els.styleRow.innerHTML = STYLES.map(s=>`<button class="seg-btn" data-style="${s.id}">${s.label}</button>`).join('');
  els.styleRow.querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.style = btn.dataset.style;
      syncStyleRow();
      scheduleRender();
      pushHistory();
    });
  });
  syncStyleRow();
}
function syncStyleRow(){
  els.styleRow.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.style===state.style));
}

function buildColorRow(){
  const modes = [{id:'solid',label:'SOLID'},{id:'gradient',label:'GRADIENT'}];
  $('color-mode-row').innerHTML = modes.map(m=>`<button class="seg-btn" data-mode="${m.id}">${m.label}</button>`).join('');
  $('color-mode-row').querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.colorMode = btn.dataset.mode;
      syncColorRow();
      scheduleRender(true);
      pushHistory();
    });
  });
  syncColorRow();
}
function syncColorRow(){
  $('color-mode-row').querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===state.colorMode));
  const wrap = $('color-swatches');
  wrap.innerHTML = `<input type="color" class="swatch-input" id="color1-input" value="${state.color1}">` +
    (state.colorMode==='gradient' ? `<input type="color" class="swatch-input" id="color2-input" value="${state.color2}">` : '');
  $('color1-input').addEventListener('input', e=>{ state.color1 = e.target.value; scheduleRender(true); });
  $('color1-input').addEventListener('change', ()=> pushHistory());
  if(state.colorMode==='gradient'){
    $('color2-input').addEventListener('input', e=>{ state.color2 = e.target.value; scheduleRender(true); });
    $('color2-input').addEventListener('change', ()=> pushHistory());

}

/* ============================================================
   HISTORY
============================================================ */
function pushHistory(){
  clearTimeout(historyDebounce);
  historyDebounce = setTimeout(()=>{
    const snap = JSON.stringify(state);
    if(history[historyIdx] === snap) return;
    history = history.slice(0, historyIdx+1);
    history.push(snap);
    if(history.length>40) history.shift();
    historyIdx = history.length-1;
    updateHistoryButtons();
  }, 250);
}
function updateHistoryButtons(){
  $('btn-undo').disabled = historyIdx<=0;
  $('btn-redo').disabled = historyIdx>=history.length-1;
}
$('btn-undo').addEventListener('click', ()=>{
  if(historyIdx<=0) return;
  historyIdx--;
  state = JSON.parse(history[historyIdx]);
  refreshAllControls();
  scheduleRender(true);
  updateHistoryButtons();
});
$('btn-redo').addEventListener('click', ()=>{
  if(historyIdx>=history.length-1) return;
  historyIdx++;
  state = JSON.parse(history[historyIdx]);
  refreshAllControls();
  scheduleRender(true);
  updateHistoryButtons();
});

function handleFile(file){
  if(!file) return;
  if(file.type.startsWith('video/')) return handleVideoFile(file);
  if(file.type.startsWith('image/')) return handleImageFile(file);
}

function handleImageFile(file){
  stopVideoPreviewLoop();
  showSpinner(true);
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const image = new Image();
    image.onload = ()=>{
      img = image;
      naturalW = image.naturalWidth;
      naturalH = image.naturalHeight;
      onImageReady();
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function showMediaChrome(){
  els.emptyState.style.display = 'none';
  els.actionRow.classList.add('show');
  els.canvasStage.classList.add('show');
  els.bottomPanel.classList.add('show');
}

function onImageReady(){
  mediaType = 'image';
  if(videoEl){ videoEl.pause(); videoEl.src=''; videoEl=null; }
  if(videoObjectUrl){ URL.revokeObjectURL(videoObjectUrl); videoObjectUrl=null; }
  showMediaChrome();
  els.scrubBar.classList.add('hidden');

  const maxDim = 1100;
  const scale = Math.min(1, maxDim / Math.max(naturalW, naturalH));
  previewW = Math.max(1, Math.round(naturalW*scale));
  previewH = Math.max(1, Math.round(naturalH*scale));
  els.after.width = previewW; els.after.height = previewH;

  lumPreview = buildLumBuffer(img, previewW, previewH);

  state = Object.assign({}, DEFAULTS);
  refreshAllControls();
  buildFormatRow();
  history = []; historyIdx=-1;
  scheduleRender(true);
  pushHistory();
  showSpinner(false);
}

function handleVideoFile(file){
  showSpinner(true);
  stopVideoPreviewLoop();
  if(videoObjectUrl){ URL.revokeObjectURL(videoObjectUrl); videoObjectUrl=null; }
  const url = URL.createObjectURL(file);
  videoObjectUrl = url;
  const v = document.createElement('video');
  v.src = url; v.muted = true; v.playsInline = true; v.loop = true; v.crossOrigin = 'anonymous';
  v.addEventListener('loadedmetadata', ()=>{
    videoEl = v;
    naturalW = v.videoWidth; naturalH = v.videoHeight;
    videoDuration = v.duration || 0;
    onVideoReady();
  }, {once:true});
  v.addEventListener('error', ()=>{
    showSpinner(false);
    alert('Video tidak dapat dibuka. Coba format lain (mp4/webm).');
  }, {once:true});
}

function onVideoReady(){
  mediaType = 'video';
  img = null;
  showMediaChrome();
  els.scrubBar.classList.remove('hidden');

  const maxDim = 640;
  const scale = Math.min(1, maxDim / Math.max(naturalW, naturalH));
  previewW = Math.max(1, Math.round(naturalW*scale));
  previewH = Math.max(1, Math.round(naturalH*scale));
  els.after.width = previewW; els.after.height = previewH;

  state = Object.assign({}, DEFAULTS);
  refreshAllControls();
  buildFormatRow();
  history = []; historyIdx=-1;
  pushHistory();

  els.scrubInput.value = 0;
  updateVideoTimeLabel();

  videoPreviewPlaying = true;
  syncPreviewPlayIcon();
  videoEl.currentTime = 0;
  videoEl.play().catch(()=>{ videoPreviewPlaying=false; syncPreviewPlayIcon(); });
  startVideoPreviewLoop();
  showSpinner(false);
}

function startVideoPreviewLoop(){
  if(videoPreviewLoopRunning) return;
  videoPreviewLoopRunning = true;
  lastPreviewFrameT = 0;
  function loop(t){
    if(!videoPreviewLoopRunning) return;
    if(mediaType==='video' && videoEl && !exportState.running){
      if(t - lastPreviewFrameT >= PREVIEW_FRAME_INTERVAL){
        lastPreviewFrameT = t;
        renderVideoFrame();
        if(videoPreviewPlaying && videoDuration>0){
          els.scrubInput.value = Math.round((videoEl.currentTime/videoDuration)*1000);
          updateVideoTimeLabel();
        }
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
function stopVideoPreviewLoop(){ videoPreviewLoopRunning = false; }

function renderVideoFrame(){
  if(!videoEl || !previewW) return;
  lumPreview = buildLumBuffer(videoEl, previewW, previewH);
  render(ctxAfter, previewW, previewH, lumPreview);
}

function updateVideoTimeLabel(){
  if(!videoEl) return;
  const fmt = s=>{ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  els.scrubTime.textContent = fmt(videoEl.currentTime)+' / '+fmt(videoDuration);
}
function syncPreviewPlayIcon(){
  els.iconPlay.style.display = videoPreviewPlaying ? 'none':'block';
  els.iconPause.style.display = videoPreviewPlaying ? 'block':'none';
}
els.btnPreviewPlayPause.addEventListener('click', ()=>{
  if(!videoEl) return;
  videoPreviewPlaying = !videoPreviewPlaying;
  if(videoPreviewPlaying) videoEl.play().catch(()=>{}); else videoEl.pause();
  syncPreviewPlayIcon();
});
els.scrubInput.addEventListener('input', ()=>{
  if(!videoEl || !videoDuration) return;
  videoPreviewPlaying = false;
  videoEl.pause();
  syncPreviewPlayIcon();
  videoEl.currentTime = (els.scrubInput.value/1000)*videoDuration;
  updateVideoTimeLabel();
  videoEl.addEventListener('seeked', renderVideoFrame, {once:true});
});

/* ============================================================
   LUMINANCE
============================================================ */
function buildLumBuffer(image, w, h){
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d', {willReadFrequently:true});
  octx.drawImage(image, 0, 0, w, h);
  const id = octx.getImageData(0,0,w,h).data;
  const data = new Float32Array(w*h);
  for(let i=0, p=0; i<id.length; i+=4, p++){
    data[p] = (0.299*id[i] + 0.587*id[i+1] + 0.114*id[i+2]) / 255;
  }
  return {data, w, h};
}
function sampleLum(buf, nx, ny){
  let x = nx*(buf.w-1), y = ny*(buf.h-1);
  if(x<0)x=0; if(y<0)y=0; if(x>buf.w-1)x=buf.w-1; if(y>buf.h-1)y=buf.h-1;
  const x0=Math.floor(x), y0=Math.floor(y);
  const x1=Math.min(x0+1,buf.w-1), y1=Math.min(y0+1,buf.h-1);
  const fx=x-x0, fy=y-y0;
  const w=buf.w;
  const v00=buf.data[y0*w+x0], v10=buf.data[y0*w+x1];
  const v01=buf.data[y1*w+x0], v11=buf.data[y1*w+x1];
  const a = v00*(1-fx)+v10*fx;
  const b = v01*(1-fx)+v11*fx;
  return a*(1-fy)+b*fy;
}
function gammaFromThreshold(threshold){
  const t = threshold/100;
  return 2.4 - t*2.05;
}
function darknessAt(nx, ny, buf, st){
  const raw = sampleLum(buf, nx, ny);
  const contrastFactor = st.contrast/100;
  let v = (raw-0.5)*contrastFactor + 0.5 + (st.brightness/100);
  if(v<0)v=0; if(v>1)v=1;
  let dark = 1-v;
  if(st.invert) dark = 1-dark;
  const gamma = gammaFromThreshold(st.threshold);
  dark = Math.pow(Math.max(0,dark), gamma);
  return dark;
}

/* ============================================================
   RENDER ENGINE — connected spiral / rings, plus a dedicated dot style
============================================================ */
let rafPending = false;
function scheduleRender(immediate){
  if(mediaType==='video'){
    if(!videoPreviewPlaying) renderVideoFrame();
    return;
  }
  if(!img) return;
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    render(ctxAfter, previewW, previewH, lumPreview);
  });
}

function makeArtFill(ctx, st, W, H, cx, cy, minDim){
  if(st.colorMode!=='gradient') return st.color1;
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,minDim/2);
  g.addColorStop(0, st.color1);
  g.addColorStop(1, st.color2);
  return g;
}
function makeBgFill(ctx, st, W, H){
  if(st.bgMode==='transparent') return null;
  if(st.bgMode==='gradient'){
    const g = ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0, st.bgColor1);
    g.addColorStop(1, st.bgColor2);
    return g;
  }
  return st.bgColor1;
}

function render(ctx, W, H, buf){
  const st = state;
  const cx = W/2, cy = H/2;
  const minDim = Math.min(W,H);
  ctx.save();
  ctx.clearRect(0,0,W,H);
  const bgFill = makeBgFill(ctx, st, W, H);
  if(bgFill){ ctx.fillStyle = bgFill; ctx.fillRect(0,0,W,H); }
  ctx.fillStyle = makeArtFill(ctx, st, W, H, cx, cy, minDim);
  ctx.strokeStyle = ctx.fillStyle;
  switch(st.style){
    case 'lines': drawRingsConnected(ctx,W,H,buf,st,cx,cy,minDim); break;
    case 'dots':  drawDotsPattern(ctx,W,H,buf,st,cx,cy,minDim); break;
    case 'spiral':
    default: drawSpiralConnected(ctx,W,H,buf,st,cx,cy,minDim); break;
  }
  ctx.restore();
}

/* Build a solid, single filled ribbon along a path of center points
   with a per-point half-width — outer edge forward, inner edge
   backward, closed into one polygon. Because it's one fill() call
   on one closed shape, there is no possible seam or gap between
   samples: the whole spiral/ring is structurally one connected
   shape, not a chain of separately-stroked segments. */
function fillRibbon(ctx, pts, closed){
  const n = pts.length;
  const outer = new Array(n), inner = new Array(n);
  for(let i=0;i<n;i++){
    const p = pts[i];
    const p0 = pts[closed ? (i-1+n)%n : Math.max(0,i-1)];
    const p1 = pts[closed ? (i+1)%n : Math.min(n-1,i+1)];
    let tx = p1.x-p0.x, ty = p1.y-p0.y;
    const len = Math.hypot(tx,ty) || 1;
    tx/=len; ty/=len;
    const nx = -ty, ny = tx;
    outer[i] = {x:p.x+nx*p.hw, y:p.y+ny*p.hw};
    inner[i] = {x:p.x-nx*p.hw, y:p.y-ny*p.hw};
  }
  ctx.beginPath();
  ctx.moveTo(outer[0].x, outer[0].y);
  for(let i=1;i<n;i++) ctx.lineTo(outer[i].x, outer[i].y);
  if(closed) ctx.lineTo(outer[0].x, outer[0].y);
  for(let i=n-1;i>=0;i--) ctx.lineTo(inner[i].x, inner[i].y);
  ctx.closePath();
  ctx.fill();
}

/* Single unbroken spiral ribbon: width tracks local darkness but
   never drops to zero, and the whole curve is one filled polygon —
   so it always stays connected end to end instead of breaking into
   dashes or dots. */
function drawSpiralConnected(ctx,W,H,buf,st,cx,cy,minDim){
  const maxRadius = (minDim/2) * (st.size/100) * 0.96;
  const turns = Math.max(1.5, (st.amount/8) * (100/st.spacing));
  const totalAngle = turns * Math.PI * 2;
  const rot = (st.rotation/180)*Math.PI;
  const segCount = Math.max(400, Math.min(14000, Math.round(90*turns*(st.detail/100))));
  const angleStep = totalAngle/segCount;
  const thicknessBase = st.thickness;

  const pts = new Array(segCount+1);
  for(let i=0;i<=segCount;i++){
    const theta = i*angleStep;
    const r = (theta/totalAngle) * maxRadius;
    const ang = theta + rot;
    const x = cx + r*Math.cos(ang);
    const y = cy + r*Math.sin(ang);
    const nx = x/W, ny = y/H;
    let dark = 0;
    if(nx>=0&&nx<=1&&ny>=0&&ny<=1) dark = darknessAt(nx,ny,buf,st);
    const hw = thicknessBase*(0.22+dark*1.8)/2;
    pts[i] = {x,y,hw};
  }
  fillRibbon(ctx, pts, false);
}

/* Concentric rings, each drawn as one closed, unbroken ribbon loop. */
function drawRingsConnected(ctx,W,H,buf,st,cx,cy,minDim){
  const maxRadius = (minDim/2) * (st.size/100) * 0.96;
  const ringCount = Math.max(2, Math.round((st.amount/6) * (100/st.spacing)));
  const radiusStep = maxRadius/ringCount;
  const rot = (st.rotation/180)*Math.PI;
  const thicknessBase = st.thickness;
  const targetSegLen = Math.max(0.9, 6.5/(st.detail/100));

  for(let ring=1; ring<=ringCount; ring++){
    const r = ring*radiusStep;
    const segPerRing = Math.max(24, Math.min(2000, Math.round((2*Math.PI*r)/targetSegLen)));
    const angleStep = (Math.PI*2)/segPerRing;
    const pts = new Array(segPerRing);
    for(let i=0;i<segPerRing;i++){
      const ang = i*angleStep + rot;
      const x = cx + r*Math.cos(ang);
      const y = cy + r*Math.sin(ang);
      const nx=x/W, ny=y/H;
      let dark=0;
      if(nx>=0&&nx<=1&&ny>=0&&ny<=1) dark = darknessAt(nx,ny,buf,st);
      const hw = thicknessBase*(0.25+dark*1.6)/2;
      pts[i] = {x,y,hw};
    }
    fillRibbon(ctx, pts, true);
  }
}

/* Explicit dot / halftone style — a spiral path of discrete dots
   whose size tracks darkness, for people who want the stipple look
   on purpose (rather than it happening by accident). */
function drawDotsPattern(ctx,W,H,buf,st,cx,cy,minDim){
  const maxRadius = (minDim/2) * (st.size/100) * 0.96;
  const turns = Math.max(1.5, (st.amount/8) * (100/st.spacing));
  const totalAngle = turns * Math.PI * 2;
  const rot = (st.rotation/180)*Math.PI;
  const thicknessBase = st.thickness;
  const dotStep = Math.max(0.03, 0.16/(st.detail/100));

  for(let theta=0; theta<=totalAngle; theta+=dotStep){
    const r = (theta/totalAngle) * maxRadius;
    const ang = theta + rot;
    const x = cx + r*Math.cos(ang);
    const y = cy + r*Math.sin(ang);
    const nx = x/W, ny = y/H;
    let dark = 0;
    if(nx>=0&&nx<=1&&ny>=0&&ny<=1) dark = darknessAt(nx,ny,buf,st);
    const radius = thicknessBase*(0.15+dark*1.4)*0.55;
    if(radius<0.35) continue;
    ctx.beginPath();
    ctx.arc(x,y,radius,0,Math.PI*2);
    ctx.fill();
  }
}

/* ============================================================
   EXPORT — image
============================================================ */
function exportImage(){
  if(!img) return;
  showSpinner(true);
  setTimeout(()=>{
    const maxExportDim = 2200;
    const scale = Math.min(1, maxExportDim/Math.max(naturalW,naturalH));
    const ew = Math.max(1,Math.round(naturalW*scale));
    const eh = Math.max(1,Math.round(naturalH*scale));
    const exBuf = buildLumBuffer(img, ew, eh);
    const off = document.createElement('canvas');
    off.width=ew; off.height=eh;
    const octx = off.getContext('2d');
    render(octx, ew, eh, exBuf);

    // JPEG has no alpha channel — if the background was left transparent,
    // composite onto white first so it doesn't turn black on export.
    let outCanvas = off;
    if(imageFmt==='jpeg' && state.bgMode==='transparent'){
      const comp = document.createElement('canvas');
      comp.width=ew; comp.height=eh;
      const cctx = comp.getContext('2d');
      cctx.fillStyle = '#ffffff';
      cctx.fillRect(0,0,ew,eh);
      cctx.drawImage(off,0,0);
      outCanvas = comp;
    }

    const mime = imageFmt==='png'? 'image/png' : imageFmt==='jpeg'? 'image/jpeg' : 'image/webp';
    outCanvas.toBlob((blob)=>{
      showSpinner(false);
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'spiral-art.' + (imageFmt==='jpeg'?'jpg':imageFmt);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }, mime, 0.92);
  }, 30);
}

/* ============================================================
   EXPORT — video
============================================================ */
function pickVideoMime(preferMp4){
  const webmCandidates = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mp4Candidates = ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4'];
  const candidates = preferMp4 ? mp4Candidates.concat(webmCandidates) : webmCandidates.concat(mp4Candidates);
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}
function loadFFmpegScript(){
  return new Promise((resolve,reject)=>{
    if(window.FFmpeg){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('gagal memuat pustaka konversi MP4 (perlu koneksi internet)'));
    document.head.appendChild(s);
  });
}
async function getFFmpeg(){
  if(ffmpegInstance) return ffmpegInstance;
  if(!ffmpegLoadingPromise){
    ffmpegLoadingPromise = (async ()=>{
      await loadFFmpegScript();
      const { createFFmpeg } = window.FFmpeg;
      const inst = createFFmpeg({ log:false, corePath:'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
      await inst.load();
      ffmpegInstance = inst;
      return inst;
    })();
  }
  return ffmpegLoadingPromise;
}
async function convertWebmToMp4(webmBlob, onProgress){
  const ffmpeg = await getFFmpeg();
  const { fetchFile } = window.FFmpeg;
  ffmpeg.setProgress(({ratio})=>{ if(onProgress && ratio>=0 && ratio<=1) onProgress(ratio); });
  ffmpeg.FS('writeFile', 'input.webm', await fetchFile(webmBlob));
  await ffmpeg.run('-i','input.webm','-c:v','libx264','-preset','veryfast','-crf','23','-pix_fmt','yuv420p','-c:a','aac','-b:a','160k','output.mp4');
  const data = ffmpeg.FS('readFile','output.mp4');
  try{ ffmpeg.FS('unlink','input.webm'); ffmpeg.FS('unlink','output.mp4'); }catch(e){}
  return new Blob([data.buffer], {type:'video/mp4'});
}

function setExportUI(running){
  els.btnExport.disabled = running;
  els.exportProgressWrap.classList.toggle('show', running);
  els.btnPreviewPlayPause.disabled = running;
  els.scrubInput.disabled = running;
}
function setExportProgress(pct, statusText){
  els.exportBar.style.width = Math.round(pct*100)+'%';
  els.exportPct.textContent = Math.round(pct*100)+'%';
  if(statusText) els.exportStatus.textContent = statusText;
}
$('btn-export-cancel').addEventListener('click', ()=>{ exportState.cancelled = true; });

function startVideoExport(){
  if(!videoEl || exportState.running) return;
  if(!window.MediaRecorder){ alert('Perekaman video tidak didukung di browser ini.'); return; }
  const mimeType = pickVideoMime(exportState.format==='mp4');
  if(!mimeType){ alert('Browser ini tidak mendukung format perekaman video yang tersedia.'); return; }

  exportState.running = true;
  exportState.cancelled = false;
  setExportUI(true);
  setExportProgress(0, 'Menyiapkan…');

  videoPreviewPlaying = false;
  syncPreviewPlayIcon();
  videoEl.pause();

  const scale = Math.min(1, exportState.resolution / Math.max(naturalW, naturalH));
  const ew = Math.max(2, Math.round(naturalW*scale/2)*2);
  const eh = Math.max(2, Math.round(naturalH*scale/2)*2);

  exportCanvas = document.createElement('canvas');
  exportCanvas.width = ew; exportCanvas.height = eh;
  exportCtx = exportCanvas.getContext('2d');

  const finish = (success)=>{
    exportState.running = false;
    setExportUI(false);
    setExportProgress(0);
    videoEl.currentTime = 0;
    videoPreviewPlaying = true;
    videoEl.play().catch(()=>{ videoPreviewPlaying=false; syncPreviewPlayIcon(); });
    syncPreviewPlayIcon();
    if(!success) showSpinner(false);
  };

  const onSeekedToStart = ()=>{
    videoEl.removeEventListener('seeked', onSeekedToStart);
    let tracks = [];
    try{
      const canvasStream = exportCanvas.captureStream(exportState.fps);
      tracks = tracks.concat(canvasStream.getVideoTracks());
    } catch(err){ alert('Gagal membuat aliran video untuk direkam.'); finish(false); return; }
    if(exportState.includeAudio){
      try{
        const vidStream = videoEl.captureStream ? videoEl.captureStream() : (videoEl.mozCaptureStream ? videoEl.mozCaptureStream() : null);
        if(vidStream) tracks = tracks.concat(vidStream.getAudioTracks());
      } catch(err){}
    }
    const outStream = new MediaStream(tracks);
    let recorder;
    try{ recorder = new MediaRecorder(outStream, {mimeType, videoBitsPerSecond: 6000000}); }
    catch(err){ alert('Gagal memulai perekaman video: '+err.message); finish(false); return; }
    exportRecorder = recorder;
    exportChunks = [];
    recorder.ondataavailable = e=>{ if(e.data && e.data.size) exportChunks.push(e.data); };

    recorder.onstop = async ()=>{
      if(exportState.cancelled || exportChunks.length===0){ finish(false); return; }
      const recordedMime = mimeType.split(';')[0];
      const rawBlob = new Blob(exportChunks, {type:recordedMime});
      const downloadBlob = (blob, ext)=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'spiral-video.'+ext;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
      };
      if(recordedMime.indexOf('mp4')>=0){ downloadBlob(rawBlob, 'mp4'); finish(true); return; }
      if(exportState.format==='mp4'){
        setExportProgress(0, 'Mengonversi ke MP4…');
        try{
          const mp4Blob = await convertWebmToMp4(rawBlob, (ratio)=>{ setExportProgress(ratio, 'Mengonversi ke MP4…'); });
          downloadBlob(mp4Blob, 'mp4'); finish(true);
        } catch(err){
          alert('Konversi ke MP4 gagal ('+err.message+'). Video diunduh sebagai WebM sebagai gantinya.');
          downloadBlob(rawBlob, 'webm'); finish(true);
        }
        return;
      }
      downloadBlob(rawBlob, 'webm'); finish(true);
    };

    videoEl.muted = true;
    recorder.start(250);
    let stopTimer = null;
    const drawTick = ()=>{
      if(exportState.cancelled){ clearTimeout(stopTimer); videoEl.pause(); if(recorder.state!=='inactive') recorder.stop(); return; }
      if(videoEl.ended){
        if(!stopTimer) stopTimer = setTimeout(()=>{ if(recorder.state!=='inactive') recorder.stop(); }, 250);
        return;
      }
      const buf = buildLumBuffer(videoEl, ew, eh);
      render(exportCtx, ew, eh, buf);
      if(videoDuration>0) setExportProgress(Math.min(1, videoEl.currentTime/videoDuration), 'Memproses…');
      requestAnimationFrame(drawTick);
    };
    videoEl.play().then(()=>{ requestAnimationFrame(drawTick); }).catch(err=>{
      alert('Gagal memutar video untuk direkam: '+err.message);
      if(recorder.state!=='inactive') recorder.stop();
    });
  };

  if(Math.abs(videoEl.currentTime) < 0.01){ onSeekedToStart(); }
  else { videoEl.addEventListener('seeked', onSeekedToStart); videoEl.currentTime = 0; }
}

els.btnExport.addEventListener('click', ()=>{
  if(mediaType==='video') startVideoExport();
  else exportImage();
});

/* ============================================================
   MISC
============================================================ */
function showSpinner(show){ els.spinner.classList.toggle('show', show); }

})();
